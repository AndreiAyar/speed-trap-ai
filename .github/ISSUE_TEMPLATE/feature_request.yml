name: Feature request
description: Suggest a change to the recorded-video workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how someone would use it and any alternatives you considered.
    validations:
      required: true
