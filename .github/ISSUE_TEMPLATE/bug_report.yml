name: Bug report
description: Report a reproducible problem with setup, processing, or the dashboard.
body:
  - type: markdown
    attributes:
      value: "Remove private paths, tokens, faces, and license plates from examples. Use the private security report form for vulnerabilities."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or UI steps and a minimal configuration if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Operating system, commit, Node/pnpm/Python versions, CPU/GPU, and relevant pnpm run doctor output."
    validations:
      required: true
  - type: textarea
    id: video
    attributes:
      label: Recording details
      description: "Resolution, FPS, file format, gate order, and distance. Do not upload private footage."
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove sensitive information first.
      render: text
