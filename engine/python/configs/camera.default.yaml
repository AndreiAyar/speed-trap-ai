# Example resolution: 3840x2160. Copy calibration YAML from the dashboard.

# Camera-specific example. Recalibrate for your own scene and original video resolution.
scene_id: example-road-4k

# Weights download on first run. Internet is required once.
model_primary: yolo26n.pt
model_fallback: yolo11n.pt

# ByteTrack associates detections across frames; it does not calculate speed.
tracker: bytetrack.yaml

# auto: Apple MPS, then CUDA if available, otherwise CPU. cpu forces CPU.
device: auto

# COCO classes: car, motorcycle, bus, truck.
classes: [2, 3, 5, 7]
conf_threshold: 0.25

# The red dot at the bottom-center of each box controls crossing time.
anchor_point: bottom_center

# Gate A starts timing; gate B stops it. Coordinates are native video pixels.
line_a:
  - [1382, 1348]
  - [1580, 1275]
line_b:
  - [1893, 1455]
  - [2137, 1365]

# Filters speed events; [] allows the full frame. YOLO still detects the full frame.
roi_polygon:
  - [536, 1092]
  - [3839, 1570]
  - [3839, 2099]
  - [3, 2159]

# Replace this example with MEASURED road distance. Pixels are not meters.
distance_meters: 20.2

# Expected image-space motion [x, y]; positive y points down.
direction: [0.0, 1.0]

# Blurs detected vehicles. This is not guaranteed plate anonymization.
privacy_blur: true

# Short motion trails help visualize tracking.
trail_enabled: true
trail_length_frames: 22
trail_thickness: 2

# Suppress repeated crossing events caused by position jitter (milliseconds).
min_crossing_delta_ms: 150

# The engine always draws this required notice.
disclaimer_text: Doar pentru divertisment. Nu este masurare legala.
