# Real-world distance (meters) between line A and line B.
# You should measure this once per scene.
distance_meters: 20.2 #16.9 #21 #16.9
# ROI (Region of Interest) - Defines a polygonal area within the video frame where analysis should be performed.
# Only objects and events detected within this polygon will be processed by the detection engine.
# Leave empty to analyze the entire video frame without spatial restrictions.
# Expected format: List of [x, y] coordinates defining the polygon vertices in pixel coordinates.
# Example: [[0, 0], [640, 0], [640, 480], [0, 480]]

# Optional ROI polygon to restrict analysis area.
# If empty, full frame is used.
# roi_polygon:
  # ROI tuned for monitored carriageway (vehicles approaching camera) in 3840x2160 frame.
  # - [1320, 620]
  # - [2620, 620]
  # - [2240, 2150]
  # - [60, 2150]

# Direction vector for expected vehicle movement (x, y).
# Example below means mostly downward movement in frame.
direction: [0.0, 1.0]

# Blur vehicles by default for safer publishing.
privacy_blur: true

# Draw short trail behind each tracked vehicle for visual debugging and storytelling.
trail_enabled: true

# Number of recent points kept in trail polyline per track.
trail_length_frames: 22

# Trail line thickness in pixels.
trail_thickness: 2

# Minimum milliseconds between crossing checks for same track to reduce jitter noise.
min_crossing_delta_ms: 150

# Overlay text disclaimer shown on output video.
disclaimer_text: "Doar pentru divertisment. Nu este masurare legala."
